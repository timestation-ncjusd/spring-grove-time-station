<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta name="theme-color" content="#064b35">

  <title>Spring Grove Employee Time Station</title>

  <!-- QR scanner -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client">
  </script>

  <style>
    :root {
      --green: #064b35;
      --dark-green: #033d2b;
      --gold: #d7a928;
      --white: #ffffff;
      --cream: #f8f4e9;
      --gray: #5f6368;
      --light-gray: #eef1ef;
      --success: #16733c;
      --error: #a61b1b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 16px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(215, 169, 40, 0.12),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #f8f4e9,
          #efe9db
        );

      color: var(--dark-green);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .kiosk {
      width: min(100%, 760px);
      min-height: 94vh;

      background: var(--white);

      border-radius: 28px;
      overflow: hidden;

      border:
        1px solid
        rgba(6, 75, 53, 0.12);

      box-shadow:
        0 16px 46px
        rgba(0, 0, 0, 0.18);

      display: flex;
      flex-direction: column;
    }

    .header {
      background:
        linear-gradient(
          135deg,
          var(--dark-green),
          var(--green)
        );

      color: var(--white);

      padding: 22px 20px 18px;

      text-align: center;

      border-bottom:
        7px solid var(--gold);
    }

    .logo {
      width: 68px;
      height: 68px;

      margin: 0 auto 12px;

      border-radius: 50%;

      background: var(--gold);

      border:
        4px solid
        rgba(255,255,255,0.9);

      color: var(--dark-green);

      display: grid;
      place-items: center;

      font-size: 27px;
      font-weight: 800;
    }

    .school-name {
      margin: 0;

      font-size:
        clamp(
          27px,
          5vw,
          42px
        );

      line-height: 1.05;
    }

    .station-name {
      margin: 7px 0 0;

      font-size:
        clamp(
          14px,
          2.5vw,
          19px
        );

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .content {
      flex: 1;

      padding: 28px 20px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .screen {
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    #reader {
      width: min(100%, 540px);

      margin:
        18px auto 0;

      overflow: hidden;

      border-radius: 20px;

      border:
        5px solid var(--gold);

      background: #111;
    }

    .scan-title {
      margin: 0;

      font-size:
        clamp(
          28px,
          5vw,
          42px
        );
    }

    .scan-instruction {
      margin:
        10px auto 0;

      color: var(--gray);

      font-size: 19px;
      line-height: 1.4;
    }

    .status {
      margin:
        15px auto 0;

      min-height: 26px;

      font-size: 17px;
      font-weight: 700;

      color: var(--green);
    }

    .auth-button,
    .manual-button {
      border: 0;
      cursor: pointer;

      background: var(--green);
      color: var(--white);

      border-radius: 12px;

      padding: 14px 22px;

      font-size: 18px;
      font-weight: 700;
    }

    .auth-button {
      margin-top: 22px;
    }

    .manual-area {
      width: min(100%, 460px);

      margin:
        24px auto 0;

      padding-top: 20px;

      border-top:
        1px solid #ddd;
    }

    .manual-label {
      display: block;

      margin-bottom: 9px;

      color: var(--gray);

      font-size: 15px;
      font-weight: 700;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    #manualEmployeeId {
      flex: 1;

      min-width: 0;

      padding: 13px 12px;

      border:
        2px solid #c8cfcb;

      border-radius: 10px;

      font-size: 18px;
    }

    .status-icon {
      width: 108px;
      height: 108px;

      margin:
        0 auto 20px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      color: var(--white);

      font-size: 64px;
      font-weight: 700;

      box-shadow:
        0 10px 24px
        rgba(0,0,0,0.15);
    }

    .status-icon.success {
      background: var(--success);
    }

    .status-icon.error {
      background: var(--error);
    }

    #resultGreeting {
      margin:
        0 0 10px;

      font-size:
        clamp(
          30px,
          6vw,
          48px
        );
    }

    .employee-name {
      margin:
        14px 0;

      font-size:
        clamp(
          34px,
          7vw,
          58px
        );

      font-weight: 800;

      overflow-wrap: anywhere;
    }

    .action {
      margin-top: 8px;

      font-size:
        clamp(
          24px,
          4vw,
          35px
        );

      font-weight: 600;
    }

    .time {
      margin-top: 10px;

      color: var(--green);

      font-size:
        clamp(
          42px,
          8vw,
          70px
        );

      font-weight: 800;
    }

    .result-message {
      max-width: 520px;

      margin:
        22px auto 0;

      color: var(--gray);

      font-size: 20px;
      line-height: 1.4;
    }

    .footer {
      padding: 15px;

      text-align: center;

      background: var(--dark-green);

      color: var(--white);

      font-size: 15px;
      font-weight: 600;

      letter-spacing: .5px;
    }

    @media (max-width: 640px) {

      body {
        padding: 0;
      }

      .kiosk {
        min-height: 100vh;
        border-radius: 0;
      }

      .content {
        padding:
          22px 15px;
      }
    }
  </style>
</head>

<body>

  <main class="kiosk">

    <header class="header">

      <div class="logo">
        SG
      </div>

      <h1 class="school-name">
        SPRING GROVE SCHOOL
      </h1>

      <p class="station-name">
        Employee Time Station
      </p>

    </header>


    <section class="content">

      <!-- AUTHORIZATION SCREEN -->
      <div
        id="authScreen"
        class="screen hidden"
      >

        <h2 class="scan-title">
          Time Station Setup
        </h2>

        <p class="scan-instruction">
          Sign in once to activate this Time Station.
        </p>

        <button
          id="authorizeButton"
          class="auth-button"
          type="button"
        >
          Activate Time Station
        </button>

        <div
          id="authStatus"
          class="status"
        ></div>

      </div>


      <!-- SCANNER SCREEN -->
      <div
        id="scannerScreen"
        class="screen hidden"
      >

        <h2 class="scan-title">
          Scan Employee Badge
        </h2>

        <p class="scan-instruction">
          Hold your QR badge in front of the camera.
        </p>

        <div id="reader"></div>

        <div
          id="scannerStatus"
          class="status"
        >
          Camera ready
        </div>


        <div class="manual-area">

          <label
            class="manual-label"
            for="manualEmployeeId"
          >
            Or enter employee number
          </label>

          <div class="manual-row">

            <input
              id="manualEmployeeId"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="Employee number"
            >

            <button
              id="manualButton"
              class="manual-button"
              type="button"
            >
              Submit
            </button>

          </div>

        </div>

      </div>


      <!-- RESULT SCREEN -->
      <div
        id="resultScreen"
        class="screen hidden"
      >

        <div
          id="resultIcon"
          class="status-icon success"
        >
          ✓
        </div>

        <h2 id="resultGreeting">
          Welcome!
        </h2>

        <div
          id="employeeName"
          class="employee-name"
        ></div>

        <div
          id="actionText"
          class="action"
        ></div>

        <div
          id="timeText"
          class="time"
        ></div>

        <p
          id="resultMessage"
          class="result-message"
        ></p>

      </div>

    </section>


    <footer class="footer">
      One School, One Team
    </footer>

  </main>


  <script>

    // =====================================================
    // ENTER YOUR TWO GOOGLE VALUES HERE
    // =====================================================

    const CLIENT_ID =
      '553943001009-h04rat0prespkhd5k327m56nf07cbdbt.apps.googleusercontent.com';

    const SCRIPT_ID =
      '1eyfRobz0xRD-snGLzQFDdagl01GB7v2ANnB_gqkbbXkRJsWm7pN3w_us';

    const SCOPES =
      'https://www.googleapis.com/auth/spreadsheets';


    // =====================================================
    // SETTINGS
    // =====================================================

    const RESULT_DISPLAY_MS = 4000;

    let tokenClient = null;
    let accessToken = null;

    let scanner = null;
    let scannerRunning = false;
    let scanLocked = false;

    let pendingBadge = null;


    // =====================================================
    // PAGE ELEMENTS
    // =====================================================

    const authScreen =
      document.getElementById(
        'authScreen'
      );

    const scannerScreen =
      document.getElementById(
        'scannerScreen'
      );

    const resultScreen =
      document.getElementById(
        'resultScreen'
      );

    const authorizeButton =
      document.getElementById(
        'authorizeButton'
      );

    const authStatus =
      document.getElementById(
        'authStatus'
      );

    const scannerStatus =
      document.getElementById(
        'scannerStatus'
      );

    const manualEmployeeId =
      document.getElementById(
        'manualEmployeeId'
      );

    const manualButton =
      document.getElementById(
        'manualButton'
      );


    // =====================================================
    // INITIALIZE
    // =====================================================

    window.addEventListener(
      'load',
      initializeTimeStation
    );


    function initializeTimeStation() {

      if (
        CLIENT_ID.includes('PASTE_') ||
        SCRIPT_ID.includes('PASTE_')
      ) {

        showAuthScreen();

        authStatus.textContent =
          'Time Station configuration is incomplete.';

        authorizeButton.disabled = true;

        return;
      }

      tokenClient =
        google.accounts.oauth2.initTokenClient({

          client_id:
            CLIENT_ID,

          scope:
            SCOPES,

          callback:
            handleTokenResponse

        });

      showAuthScreen();

    }


    // =====================================================
    // AUTHORIZATION
    // =====================================================

    authorizeButton.addEventListener(
      'click',
      function () {

        authStatus.textContent =
          'Connecting to Google...';

        pendingBadge = null;

        requestToken(true);

      }
    );


    function requestToken(showConsent) {

      if (!tokenClient) {
        return;
      }

      tokenClient.requestAccessToken({
        prompt:
          showConsent
            ? 'consent'
            : ''
      });

    }


    function handleTokenResponse(response) {

      if (
        response.error
      ) {

        console.error(response);

        accessToken = null;

        showAuthScreen();

        authStatus.textContent =
          'Google authorization was not completed. Please try again.';

        return;
      }

      accessToken =
        response.access_token;

      const badgeToProcess =
        pendingBadge;

      pendingBadge = null;

      if (badgeToProcess) {

        callTimeStationApi(
          badgeToProcess
        );

      } else {

        showScanner();

      }

    }


    // =====================================================
    // SCANNER
    // =====================================================

    async function showScanner() {

      scanLocked = false;

      showOnly(
        scannerScreen
      );

      scannerStatus.textContent =
        'Starting camera...';

      await startScanner();

    }


    async function startScanner() {

      if (scannerRunning) {

        scannerStatus.textContent =
          'Camera ready';

        return;
      }

      try {

        if (!scanner) {

          scanner =
            new Html5Qrcode(
              'reader'
            );

        }

        const config = {
          fps: 10,

          qrbox: function (
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.floor(
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                ) * 0.72
              );

            return {
              width: size,
              height: size
            };

          }
        };

        await scanner.start(
          {
            facingMode:
              'user'
          },
          config,
          onScanSuccess,
          function () {
            // Ignore normal scan misses.
          }
        );

        scannerRunning = true;

        scannerStatus.textContent =
          'Camera ready';

      } catch (error) {

        console.error(error);

        scannerStatus.textContent =
          'Camera could not start. Check camera permission and reload the page.';

      }

    }


    async function stopScanner() {

      if (
        !scanner ||
        !scannerRunning
      ) {
        return;
      }

      try {

        await scanner.stop();

      } catch (error) {

        console.warn(error);

      }

      scannerRunning = false;

    }


    function onScanSuccess(
      decodedText
    ) {

      if (scanLocked) {
        return;
      }

      const badge =
        String(
          decodedText || ''
        ).trim();

      if (!badge) {
        return;
      }

      processBadge(
        badge
      );

    }


    // =====================================================
    // MANUAL ENTRY
    // =====================================================

    manualButton.addEventListener(
      'click',
      function () {

        const badge =
          manualEmployeeId.value.trim();

        if (!badge) {

          scannerStatus.textContent =
            'Enter an employee number.';

          return;
        }

        processBadge(
          badge
        );

      }
    );


    manualEmployeeId.addEventListener(
      'keydown',
      function (event) {

        if (
          event.key === 'Enter'
        ) {

          event.preventDefault();

          manualButton.click();

        }

      }
    );


    // =====================================================
    // PROCESS BADGE
    // =====================================================

    async function processBadge(
      badge
    ) {

      if (scanLocked) {
        return;
      }

      scanLocked = true;

      scannerStatus.textContent =
        'Recording...';

      await stopScanner();

      manualEmployeeId.value = '';

      if (!accessToken) {

        pendingBadge = badge;

        requestToken(false);

        return;
      }

      callTimeStationApi(
        badge
      );

    }


    // =====================================================
    // APPS SCRIPT API
    // =====================================================

    async function callTimeStationApi(
      badge,
      retryAfterAuth = true
    ) {

      try {

        const response =
          await fetch(
            'https://script.googleapis.com/v1/scripts/' +
            encodeURIComponent(
              SCRIPT_ID
            ) +
            ':run',
            {

              method:
                'POST',

              headers: {

                'Authorization':
                  'Bearer ' +
                  accessToken,

                'Content-Type':
                  'application/json'

              },

              body:
                JSON.stringify({

                  function:
                    'processBadgeScan',

                  parameters:
                    [badge]

                })

            }
          );


        if (
          response.status === 401 &&
          retryAfterAuth
        ) {

          accessToken = null;

          pendingBadge = badge;

          requestToken(false);

          return;

        }


        const data =
          await response.json();


        if (!response.ok) {

          console.error(data);

          throw new Error(
            data.error &&
            data.error.message
              ? data.error.message
              : 'Google API request failed.'
          );

        }


        if (data.error) {

          console.error(data.error);

          throw new Error(
            data.error.message ||
            'Apps Script execution failed.'
          );

        }


        const result =
          data.response &&
          data.response.result
            ? data.response.result
            : null;


        if (!result) {

          throw new Error(
            'No result was returned by the Time Station.'
          );

        }


        showResult(
          result
        );


      } catch (error) {

        console.error(error);

        showResult({

          success: false,

          message:
            'The system could not record the scan. Please try again or contact the office.'

        });

      }

    }


    // =====================================================
    // RESULT SCREEN
    // =====================================================

    function showResult(
      result
    ) {

      const success =
        result &&
        result.success === true;


      const resultIcon =
        document.getElementById(
          'resultIcon'
        );

      const resultGreeting =
        document.getElementById(
          'resultGreeting'
        );

      const employeeName =
        document.getElementById(
          'employeeName'
        );

      const actionText =
        document.getElementById(
          'actionText'
        );

      const timeText =
        document.getElementById(
          'timeText'
        );

      const resultMessage =
        document.getElementById(
          'resultMessage'
        );


      resultIcon.className =
        'status-icon ' +
        (
          success
            ? 'success'
            : 'error'
        );

      resultIcon.textContent =
        success
          ? '✓'
          : '!';


      if (success) {

        resultGreeting.textContent =
          result.greeting ||
          'Welcome!';

        employeeName.textContent =
          result.employeeName ||
          '';

        actionText.textContent =
          result.message ||
          '';

        timeText.textContent =
          result.time ||
          '';

        resultMessage.textContent =
          result.action === 'IN'
            ? 'Welcome to Spring Grove!'
            : 'Thank you for your work today!';

      } else {

        resultGreeting.textContent =
          'Unable to Record';

        employeeName.textContent =
          '';

        actionText.textContent =
          '';

        timeText.textContent =
          '';

        resultMessage.textContent =
          result &&
          result.message
            ? result.message
            : 'The scan could not be recorded.';

      }


      showOnly(
        resultScreen
      );


      setTimeout(
        function () {

          showScanner();

        },
        RESULT_DISPLAY_MS
      );

    }


    // =====================================================
    // SCREEN HELPERS
    // =====================================================

    function showAuthScreen() {

      showOnly(
        authScreen
      );

    }


    function showOnly(
      screen
    ) {

      authScreen.classList.add(
        'hidden'
      );

      scannerScreen.classList.add(
        'hidden'
      );

      resultScreen.classList.add(
        'hidden'
      );

      screen.classList.remove(
        'hidden'
      );

    }

  </script>

</body>
</html>
